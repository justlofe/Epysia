# MaterialsSection
editor.materials-section.receive-shadows-tooltip=Выкл: материал никогда не сэмплирует карту теней, поэтому весь поиск теней исчезает из фрагментного шейдера.\nНа густой растительности это одна из самых больших экономий на фрагментах.
