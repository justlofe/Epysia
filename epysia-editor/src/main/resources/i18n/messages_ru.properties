editor.materials-section.animate-shadow-tooltip=Влияет только на материалы с поверхностным шейдером, анимированным по времени.\nВкл: тень следует за анимацией, поэтому не кешируется и перерисовывается каждый кадр.\nВыкл: тень заморожена в момент времени 0, а освещаемый мэш продолжает анимироваться, поэтому тень можно кешировать.
